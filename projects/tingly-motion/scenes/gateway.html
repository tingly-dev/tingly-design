<x-embed data-seek data-in="fade 400ms @0.6s" style="position:absolute;left:50%;top:57%;width:640px;height:400px;transform:translate(-50%, -50%)" data-tall="top:52%;width:880px;height:520px"><style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');
let last=0;
function fit(){const D=window.devicePixelRatio||1;c.width=innerWidth*D;c.height=innerHeight*D;g.setTransform(D,0,0,D,0,0)}
function lerp(a,b,p){return{x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p}}
// Everything is drawn from t (ms into the scene), so any frame can be drawn in any order.
function draw(t){
  last=t;const W=innerWidth,H=innerHeight;g.clearRect(0,0,W,H);
  const hub={x:W/2,y:H/2},ins=[0,1,2].map(i=>({x:20,y:H*(i+1)/4})),outs=[0,1,2,3].map(i=>({x:W-20,y:H*(i+1)/5}));
  g.strokeStyle='#2B2F37';g.lineWidth=2;
  for(const p of ins){g.beginPath();g.moveTo(p.x,p.y);g.lineTo(hub.x,hub.y);g.stroke()}
  for(const p of outs){g.beginPath();g.moveTo(hub.x,hub.y);g.lineTo(p.x,p.y);g.stroke()}
  for(let k=0;k<20;k++){
    const age=t-(900+k*190);if(age<0||age>1300)continue;
    const p=age/1300,a=ins[k%3],b=outs[(k*3+1)%4],pt=p<.5?lerp(a,hub,p*2):lerp(hub,b,(p-.5)*2);
    g.fillStyle=p<.5?'#ECEEF2':'#6D9BFF';g.beginPath();g.arc(pt.x,pt.y,7,0,7);g.fill();
  }
  const r=40*Math.min(1,Math.max(0,(t-300)/500));
  g.fillStyle='#6D9BFF';g.beginPath();g.arc(hub.x,hub.y,r,0,7);g.fill();
  g.fillStyle='#111317';g.fillRect(hub.x-r*.45,hub.y-r*.45,r*.9,r*.2);g.fillRect(hub.x-r*.1,hub.y-r*.45,r*.2,r*.9);
}
fit();addEventListener('resize',()=>{fit();draw(last)});
window.seek=draw;draw(0);
</script></x-embed>
<aside>Agents on the left, providers on the right, all through one local endpoint. The routing diagram is a seekable embed.</aside>
