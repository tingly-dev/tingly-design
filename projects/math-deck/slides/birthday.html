<aside>动画是真随机模拟，每一轮都不一样：一个个人进来，生日落到 365 天的圆环上，一旦有两个人落在同一天就“撞了”。看底部记录，撞上时的人数大多在 20 到 30 之间。为什么这么少？因为要比较的不是“和我同一天”，而是“任意两个人”：23 个人之间有 253 对组合，每一对都有机会撞上。可以现场请同学报生日试一试。</aside>
