<p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#4FD1FF;width:540px">EP.02 · 圆的面积</p>
<h2 style="font-family:'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;font-size:80px;font-weight:400;line-height:1.1;color:#EAF2FF;width:560px">剥开一个圆</h2>
<p style="font-size:30px;line-height:1.6;color:#B7C6E0;width:520px">把一个圆想成一圈圈洋葱皮。从顶上沿半径剪一刀，把每一圈都拉直、摆好。它们会拼成什么形状？</p>

<p style="font-size:64px;font-weight:700;line-height:1.2;color:#FFD166">面积 = πr²</p>
<p style="font-size:24px;line-height:1.5;color:#B7C6E0">拼成一个三角形：底是周长 2πr，高是半径 r，面积 = ½ × 2πr × r。</p>

<aside>每一圈“洋葱皮”的长度就是它自己那一圈的周长。最外圈最长，是 2πr；越往里越短，最中心几乎是 0。把它们从长到短摞起来，正好是一个三角形：底 2πr，高 r。三角形面积 = 底 × 高 ÷ 2 = πr²。皮越薄，三角形的边越平，结果越精确。这个证明在一千多年前的古代文献里就出现过。</aside>
