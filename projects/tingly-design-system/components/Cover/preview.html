<!-- @dsCard height=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 0 !important; }
  .cv { height: 360px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; justify-content: center; gap: 16px; background-color: #111317; background-image: radial-gradient(#2b2f37 1.2px, transparent 1.2px); background-size: 22px 22px; position: relative; overflow: hidden; color: #eceef2; }
  .cv .ey { margin: 0; font-family: var(--font-sans); font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #6d9bff; }
  .cv h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -1px; max-width: 600px; }
  .cv h1 em { color: #6d9bff; }
  .cv p { margin: 0; font-family: var(--font-sans); color: #b3b8c3; font-size: 17px; max-width: 520px; line-height: 1.5; }
  .chips { display: flex; gap: 8px; padding-top: 8px; }
  .chips i { width: 28px; height: 28px; border-radius: 8px; display: block; border: 1px solid #2b2f37; }
  .mark { position: absolute; right: 56px; top: 48px; width: 72px; height: 72px; }
</style>
</head>
<body>
<div class="cv">
  <svg class="mark" viewBox="0 0 88 88" aria-hidden="true"><rect width="88" height="88" rx="28" fill="#eceef2"/><rect x="25" y="25" width="38" height="9" rx="2" fill="#111317"/><rect x="39.5" y="25" width="9" height="39" rx="2" fill="#111317"/></svg>
  <p class="ey">TINGLY · DESIGN SYSTEM</p>
  <h1>Tingly <em>Design System</em></h1>
  <p>Paper and ink, one blue accent, a serif for titles. Shared by Tingly Box and Tingly Design.</p>
  <div class="chips"><i style="background:#f7f7f4"></i><i style="background:#16181d"></i><i style="background:#2563eb"></i><i style="background:#15803d"></i><i style="background:#b91c1c"></i><i style="background:#b45309"></i></div>
</div>
</body>
</html>
