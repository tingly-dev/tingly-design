<section id="diff" data-duration="3s" data-transition="push 350ms" data-keys="scale: 1@0 1.05@3s" style="background:#f7f7f4;color:#16181d;font-family:'Inter', Arial, sans-serif;padding:120px 128px;display:flex;flex-direction:column;justify-content:center;gap:48px" data-tall="padding:96px">
<p data-in="fade 200ms @0s" style="font-size:28px;font-weight:800;letter-spacing:6px;color:#2563eb">EVERY EDIT WRITES BACK</p>
<div data-in="rise 300ms @0.1s" data-keys="rotate: -2@0 0@800ms snap" style="display:flex;flex-direction:column;gap:12px;padding:40px 48px;background:#ffffff;border:2px solid #e5e5e0;border-radius:28px;width:1200px;font-family:'JetBrains Mono', Menlo, monospace;font-size:56px;font-weight:700" data-tall="width:888px;font-size:44px;padding:32px">
<p data-in="wipe 300ms @0.5s" style="padding:8px 20px;background:#fde8e8;color:#b91c1c;border-radius:12px">- color: #16181d;</p>
<p data-in="type 600ms @1s" style="padding:8px 20px;background:#dcf5e3;color:#15803d;border-radius:12px">+ color: #2563eb;</p>
</div>
<h2 data-in="slam @1.75s" style="font-size:170px;font-weight:900;line-height:1;letter-spacing:-7px" data-tall="font-size:132px;letter-spacing:-5px">One-line diffs.</h2>
<aside>The git diff of a colour change is one line.</aside>
</section>
