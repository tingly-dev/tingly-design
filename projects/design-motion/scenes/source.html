<section id="source" data-duration="2s" data-keys="scale: 1.08@0 1@600ms snap" style="background:#f7f7f4;color:#16181d;font-family:'Inter', Arial, sans-serif;padding:120px 128px;display:flex;flex-direction:column;justify-content:center;gap:0px" data-tall="padding:96px">
<x-embed data-seek style="position:absolute;left:0px;top:0px;width:100%;height:100%"><style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let last=0;
function fit(){const D=window.devicePixelRatio||1;c.width=innerWidth*D;c.height=innerHeight*D;g.setTransform(D,0,0,D,0,0)}
// A dot grid that pulses on every beat (120 BPM). Drawn only from t.
function draw(t){last=t;const W=innerWidth,H=innerHeight,S=48;g.clearRect(0,0,W,H);
  const k=Math.exp(-(t%500)/110);
  for(let y=S/2;y<H;y+=S)for(let x=S/2;x<W;x+=S){
    const d=Math.hypot(x-W*.72,y-H*.5)/Math.hypot(W,H);
    const r=2+5*k*Math.max(0,1-d*2.2);
    g.fillStyle=d<.3&&k>.5?'#2563eb':'#d9d9d2';g.beginPath();g.arc(x,y,r,0,7);g.fill()}}
fit();addEventListener('resize',()=>{fit();draw(last)});window.seek=draw;draw(0);
</script></x-embed>
<p data-in="fade 200ms @0s" style="font-size:28px;font-weight:800;letter-spacing:6px;color:#2563eb">TINGLY DESIGN</p>
<h1 data-in="slam @0s" style="font-size:340px;font-weight:900;line-height:0.9;letter-spacing:-14px" data-tall="font-size:200px;letter-spacing:-8px">ONE</h1>
<h1 data-in="slam @0.5s" style="font-size:340px;font-weight:900;line-height:0.9;letter-spacing:-14px;color:#2563eb" data-tall="font-size:200px;letter-spacing:-8px">SOURCE.</h1>
<p data-in="rise 300ms @1s" style="font-size:40px;font-weight:600;padding:24px 0px 0px 0px;color:#4a4f5a">Plain files under projects/.</p>
<aside>Two beats: ONE, SOURCE. The dot grid pulses on every beat.</aside>
</section>
