<section id="rays" data-duration="3s" data-transition="fade 400ms" style="background:#07080f;color:#ffffff;font-family:'Inter', Arial, sans-serif;padding:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;position:relative;overflow:hidden" data-tall="padding:80px 56px">
<x-embed data-fx="rays; at: 50% 0%" data-seek style="position:absolute;left:0;top:0;width:100%;height:100%"></x-embed>
<x-embed data-fx="ripple; at: 50% 30%; every: 2s" data-seek style="position:absolute;left:0;top:0;width:100%;height:100%"></x-embed>
<svg data-in="pop 500ms @0.1s" aria-label="Tingly mark" width="120" height="120" viewBox="0 0 88 88" style="position:relative;width:120px;height:120px"><rect width="88" height="88" rx="28" fill="#ffffff"/><rect x="25" y="25" width="38" height="9" rx="2" fill="#16181d"/><rect x="39.5" y="25" width="9" height="39" rx="2" fill="#16181d"/></svg>
<p data-in="fade 400ms @0.2s" style="position:relative;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,0.10);font-family:Menlo, Consolas, monospace;font-size:24px;color:rgba(255,255,255,0.85)" data-tall="font-size:22px">data-fx="rays" · data-fx="ripple"</p>
<h2 data-in="rise 600ms @0.3s" style="position:relative;font-family:'Instrument Serif', Georgia, serif;font-size:150px;font-weight:400;line-height:1;text-align:center" data-tall="font-size:120px">Rays and ripple</h2>
<p data-in="rise 600ms @0.6s" style="position:relative;font-size:36px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center" data-tall="width:880px;font-size:34px">Light falling from above, rings spreading from the mark.</p>
<aside>Two layers: rays from the top edge, ripples behind the mark (at: 50% 30% is where the mark sits).</aside>
</section>
