<section id="particles" data-duration="3s" data-transition="fade 400ms" style="background:#07080f;color:#ffffff;font-family:'Inter', Arial, sans-serif;padding:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;position:relative;overflow:hidden" data-tall="padding:80px 56px">
<x-embed data-fx="mesh; amount: 0.45" data-seek style="position:absolute;left:0;top:0;width:100%;height:100%"></x-embed>
<x-embed data-fx="particles" data-seek style="position:absolute;left:0;top:0;width:100%;height:100%"></x-embed>
<p data-in="fade 400ms @0.2s" style="position:relative;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,0.10);font-family:Menlo, Consolas, monospace;font-size:24px;color:rgba(255,255,255,0.85)" data-tall="font-size:22px">data-fx="particles; direction: 270"</p>
<h2 data-in="rise 600ms @0.3s" style="position:relative;font-family:'Instrument Serif', Georgia, serif;font-size:150px;font-weight:400;line-height:1;text-align:center" data-tall="font-size:120px">Particles</h2>
<p data-in="rise 600ms @0.6s" style="position:relative;font-size:36px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center" data-tall="width:880px;font-size:34px">Soft points of light drifting upwards over any background.</p>
<aside>A layer over a background: particles drifting up over a faint mesh.</aside>
</section>
