<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 0 !important; }
  .cv { height: 360px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; justify-content: center; gap: 16px; background: radial-gradient(circle at 85% 20%, #1c2747 0%, #0e1320 60%); position: relative; overflow: hidden; color: #f3f4f6; }
  .cv .ey { margin: 0; font-family: var(--font-sans); font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #8ea2ff; }
  .cv h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 56px; line-height: 1.05; letter-spacing: -1.5px; max-width: 560px; }
  .cv p { margin: 0; font-family: var(--font-sans); color: #aeb6c6; font-size: 17px; max-width: 520px; line-height: 1.5; }
  .chips { display: flex; gap: 8px; padding-top: 8px; }
  .chips i { width: 28px; height: 28px; border-radius: 8px; display: block; border: 1px solid #2a3348; }
  svg { position: absolute; right: -110px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<div class="cv">
  <p class="ey">MERIDIAN · DESIGN SYSTEM</p>
  <h1>Meridian Design System</h1>
  <p>Paper and ink, one accent, two typefaces. Shared by the product, the board deck and the dashboards.</p>
  <div class="chips"><i style="background:#f6f5f1"></i><i style="background:#14171f"></i><i style="background:#2347d9"></i><i style="background:#12804a"></i><i style="background:#b42318"></i><i style="background:#b45309"></i></div>
  <svg width="420" height="420" viewBox="0 0 720 720" aria-hidden="true"><g fill="none" stroke="#2a3556" stroke-width="3"><circle cx="360" cy="360" r="340"/><ellipse cx="360" cy="360" rx="250" ry="340"/><ellipse cx="360" cy="360" rx="150" ry="340"/><ellipse cx="360" cy="360" rx="50" ry="340"/><ellipse cx="360" cy="360" rx="340" ry="120"/><line x1="20" y1="360" x2="700" y2="360"/></g><line x1="360" y1="20" x2="360" y2="700" stroke="#5b7cfa" stroke-width="4"/></svg>
</div>
</body>
</html>
