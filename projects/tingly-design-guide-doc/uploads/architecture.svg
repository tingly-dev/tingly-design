<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
<title>Every editor writes to the same project files</title>
<style>
:root{--ink:#1c2230;--soft:#5d6678;--line:#1c2230;--surf:#ffffff;--acc:#2f5bea;--accfill:#e6ecfd}
@media (prefers-color-scheme:dark){:root{--ink:#e6e9f0;--soft:#9aa3b5;--line:#c7cddb;--surf:#1a202c;--acc:#7b9bff;--accfill:#222c4a}}
text{fill:var(--ink)} .soft{fill:var(--soft)} .b{font-weight:700}
.box{fill:none;stroke:var(--line);stroke-width:1.2} .card{fill:var(--surf);stroke:var(--line);stroke-width:1.1}
.ln{stroke:var(--line);stroke-width:1.2;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--acc)"/></marker></defs>
<text x="20" y="22" class="soft" font-size="11">Who edits</text>
<rect class="box" x="20" y="32" width="190" height="52" rx="6"/><rect class="box" x="230" y="32" width="190" height="52" rx="6"/><rect class="box" x="440" y="32" width="190" height="52" rx="6"/><rect class="box" x="650" y="32" width="210" height="52" rx="6"/>
<text x="115" y="54" text-anchor="middle" class="b">You, on screen</text><text x="115" y="72" text-anchor="middle" class="soft">seconds · DOM operations</text>
<text x="325" y="54" text-anchor="middle" class="b">Fast AI</text><text x="325" y="72" text-anchor="middle" class="soft">seconds · jQuery statements</text>
<text x="535" y="54" text-anchor="middle" class="b">Claude Code</text><text x="535" y="72" text-anchor="middle" class="soft">minutes · edits the files</text>
<text x="755" y="54" text-anchor="middle" class="b">Terminal · CLI · MCP · git</text><text x="755" y="72" text-anchor="middle" class="soft">outside agents and scripts</text>
<g class="ln" marker-end="url(#a)"><line x1="115" y1="84" x2="115" y2="150"/><line x1="325" y1="84" x2="325" y2="150"/><line x1="535" y1="84" x2="535" y2="300"/><line x1="755" y1="84" x2="755" y2="300"/></g>
<rect x="20" y="150" width="400" height="76" rx="8" style="fill:var(--accfill);stroke:var(--acc);stroke-width:1.5"/>
<text x="220" y="174" text-anchor="middle" class="b">Write-back engine (core/copy.ts)</text>
<text x="220" y="193" text-anchor="middle">parse with positions, DOM copy, compare with the original</text>
<text x="220" y="211" text-anchor="middle">only a minimal text patch comes out</text>
<line class="ln" marker-end="url(#a)" x1="220" y1="226" x2="220" y2="300"/>
<text x="228" y="262" class="soft" font-size="11">write with a version; replay on 409</text>
<rect class="box" x="20" y="300" width="840" height="150" rx="8"/>
<text x="36" y="322" class="b">apps/server (Hono)</text>
<rect class="card" x="36" y="338" width="250" height="90" rx="6"/><rect class="card" x="304" y="338" width="250" height="90" rx="6"/><rect class="card" x="572" y="338" width="272" height="90" rx="6"/>
<text x="161" y="360" text-anchor="middle" class="b">projects/&lt;name&gt;/ files</text><text x="161" y="380" text-anchor="middle" class="soft">the only truth · file versions</text><text x="161" y="398" text-anchor="middle" class="soft">uploads/ · .claude-session.json</text><text x="161" y="416" text-anchor="middle" class="soft">.transcript.jsonl · .journal.jsonl</text>
<text x="429" y="360" text-anchor="middle" class="b">Journal + file watcher</text><text x="429" y="380" text-anchor="middle" class="soft">who, when, what changed</text><text x="429" y="398" text-anchor="middle" class="soft">outside edits are noticed</text>
<text x="708" y="360" text-anchor="middle" class="b">Capabilities</text><text x="708" y="380" text-anchor="middle" class="soft">fast AI proxy · Claude Code delegation</text><text x="708" y="398" text-anchor="middle" class="soft">Chrome/ffmpeg render · PDF · git</text><text x="708" y="416" text-anchor="middle" class="soft">zip · image generation · /mcp</text>
<g class="ln" marker-end="url(#a)"><line x1="286" y1="383" x2="304" y2="383"/><line x1="554" y1="383" x2="572" y2="383"/></g>
<path d="M870 380 L870 130 L630 130 L630 100" fill="none" style="stroke:var(--acc)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s)"/>
<text x="764" y="122" style="fill:var(--acc)" font-size="11">SSE refresh</text>
</svg>
