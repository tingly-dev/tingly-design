<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revenue overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#14171f;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width:1200px;height:760px;box-sizing:border-box;display:flex;background:#f6f5f1;overflow:hidden">
  <nav style="width:232px;background:#ffffff;border-right:1px solid #e4e2dc;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px" aria-label="Main">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px 18px">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid #14171f;box-sizing:border-box;display:flex;justify-content:center"><div style="width:2px;height:18px;background:{{accent}}"></div></div>
      <div style="font-size:16px;font-weight:700;letter-spacing:-0.2px">Meridian</div>
    </div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#646a77;margin:0 10px 6px">ACME FINANCE</div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <div style="height:{{rowHeight}};border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;background:{{n.bg}};color:{{n.color}};font-weight:{{n.weight}}">
        <div style="width:14px;height:14px;border-radius:4px;border:1.5px solid {{n.color}};box-sizing:border-box"></div>
        <div style="font-size:14px;flex:1">{{n.name}}</div>
      </div>
    </sc-for>
  </nav>
  <main style="flex:1;padding:28px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-0.3px">Revenue overview</h1>
        <div style="font-size:13px;color:#646a77">Q3 2026 · Jul 1 – Sep 30 · all regions</div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="height:34px;box-sizing:border-box;padding:0 12px;border:1px solid #e4e2dc;border-radius:8px;background:#ffffff;font-size:13px;display:flex;align-items:center">Q3 2026</div>
        <div style="height:34px;box-sizing:border-box;padding:0 14px;border-radius:8px;background:{{accent}};color:#ffffff;font-size:13px;font-weight:600;display:flex;align-items:center">Share</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="background:#ffffff;border:1px solid #e4e2dc;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:12px;font-weight:500;color:#4b5262">{{k.label}}</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:-0.4px">{{k.value}}</div>
          <div style="font-size:12px;font-weight:500;color:{{k.tone}}">{{k.delta}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr);gap:14px;flex:1;min-height:0">
      <div style="background:#ffffff;border:1px solid #e4e2dc;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-size:14px;font-weight:600">Ending ARR by quarter</div>
          <div style="font-size:12px;color:#646a77">$M</div>
        </div>
        <div style="flex:1;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid #e4e2dc;padding:0 4px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
              <div style="font-size:11px;font-weight:600;color:{{b.labelColor}}">{{b.value}}</div>
              <div style="width:100%;height:{{b.h}};background:{{b.color}};border-radius:4px 4px 0 0"></div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;gap:12px;padding:0 4px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
            <div style="flex:1;text-align:center;font-size:11px;color:#646a77">{{b.q}}</div>
          </sc-for>
        </div>
      </div>
      <div style="background:#ffffff;border:1px solid #e4e2dc;border-radius:12px;display:flex;flex-direction:column">
        <div style="padding:16px 20px;font-size:14px;font-weight:600;border-bottom:1px solid #e4e2dc">September vs target</div>
        <sc-for list="{{regions}}" as="r" hint-placeholder-count="3">
          <div style="padding:14px 20px;border-bottom:1px solid #f0eee9;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;font-size:13px">
              <div style="font-weight:500">{{r.name}}</div>
              <div style="font-weight:600;color:{{r.tone}}">{{r.pct}}</div>
            </div>
            <div style="height:6px;border-radius:3px;background:#f0eee9;display:flex">
              <div style="width:{{r.w}};border-radius:3px;background:{{r.tone}}"></div>
            </div>
          </div>
        </sc-for>
        <div style="padding:12px 20px;font-size:12px;line-height:1.5;color:#646a77">EMEA missed after two London departures in July. Sample data.</div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2347d9","options":["#2347d9","#15803d","#b45309","#7c3aed"]},"density":{"editor":"enum","default":"comfortable","options":["compact","comfortable"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2347d9';
    const ACTIVE = 'Overview';
    const items = ["Overview", "Dashboards", "Metrics", "Forecast", "Alerts", "Data sources", "Settings"];
    const nav = items.map((name) => ({
      name,
      bg: name === ACTIVE ? "#e9edfb" : "transparent",
      color: name === ACTIVE ? accent : "#4b5262",
      weight: name === ACTIVE ? 600 : 400,
    }));
    const kpis = [
      ['Ending ARR', '$52.4M', '+7.8% vs Q2', '#12804a'],
      ['Billed revenue, Q3', '$13.28M', '+2.3% Sep vs Jul', '#12804a'],
      ['Net revenue retention', '118%', 'Up from 114%', '#12804a'],
      ['Logo churn, quarterly', '1.9%', 'Down from 2.6%', '#12804a'],
    ].map(([label, value, delta, tone]) => ({ label, value, delta, tone }));
    const q = [['Q4 ’24', 33.8], ['Q1 ’25', 35.5], ['Q2 ’25', 36.6], ['Q3 ’25', 38.0], ['Q4 ’25', 41.2], ['Q1 ’26', 44.9], ['Q2 ’26', 48.6], ['Q3 ’26', 52.4]];
    const bars = q.map(([label, v], i) => ({
      q: label,
      value: v.toFixed(1),
      h: Math.round((v / 56) * 300) + 'px',
      color: i === q.length - 1 ? accent : '#c9ced8',
      labelColor: i === q.length - 1 ? accent : '#646a77',
    }));
    const regions = [['North America', 103.6], ['EMEA', 93.9], ['APAC', 108.4]].map(([name, p]) => ({
      name,
      pct: p.toFixed(1) + '%',
      w: Math.min(100, p / 1.1) + '%',
      tone: p >= 100 ? '#12804a' : '#b42318',
    }));
    return { accent, nav, kpis, bars, regions, rowHeight: this.props.density === 'compact' ? '30px' : '36px' };
  }
}
</script>
</body>
</html>
