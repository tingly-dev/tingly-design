<x-embed data-seek style="position:absolute;left:0;top:0;width:100%;height:100%;display:block"><canvas data-quality="1" style="display:block;width:100%;height:100%"></canvas><script type="text/wgsl">
struct Fx { time: f32, aspect: f32 }
@group(0) @binding(0) var<uniform> fx: Fx;
// the card the light wraps: centre and half size in units of the frame's short side
const CARD_C = vec2f(0.5, 0.42);
const CARD_H = vec2f(0.352, 0.213);
const CARD_R = 0.034;
fn sdRound(p: vec2f, b: vec2f, r: f32) -> f32 { let q = abs(p) - b + r; return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0) - r; }
fn hue(x0: f32) -> vec3f {
  let x = fract(x0) * 4.0;
  let a = vec3f(0.24, 0.47, 1.0); let b = vec3f(0.60, 0.38, 1.0); let c = vec3f(1.0, 0.44, 0.64); let d = vec3f(1.0, 0.68, 0.40);
  if (x < 1.0) { return mix(a, b, smoothstep(0.0, 1.0, x)); }
  if (x < 2.0) { return mix(b, c, smoothstep(1.0, 2.0, x)); }
  if (x < 3.0) { return mix(c, d, smoothstep(2.0, 3.0, x)); }
  return mix(d, a, smoothstep(3.0, 4.0, x));
}
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let p = (uv - CARD_C) * vec2f(fx.aspect, 1.0) / min(fx.aspect, 1.0);
  let d = sdRound(p, CARD_H, CARD_R);
  let ang = atan2(p.y, p.x) / 6.2831853;
  let col = hue(ang + fx.time * 0.06);
  let o = max(d, 0.0);
  // the light breathes unevenly around the edge, as if it were flowing
  let flow = 0.6 + 0.4 * sin(ang * 18.85 - fx.time * 1.4) * sin(ang * 6.28 + fx.time * 0.7);
  let rim = exp(-abs(d) * 260.0);
  let glow = exp(-o * (26.0 - 10.0 * flow)) * 0.55 * flow;
  let bloom = exp(-o * 5.0) * 0.10;
  let i = (rim * 0.85 + glow + bloom) * smoothstep(0.15, 1.2, fx.time);
  let c = min(col * i, vec3f(1.0));
  return vec4f(c, clamp(max(c.r, max(c.g, c.b)), 0.0, 1.0));
}
</script><script>
(function () {
  // a shader layer for motion: draws itself with vgpu where WebGPU works, else asks the renderer for each frame
  var cv = document.querySelector('canvas'), wgsl = document.querySelector('script[type="text/wgsl"]').textContent;
  var q = +(cv.dataset.quality || 0.5), w = 0, h = 0;
  var mode = new Promise(function (res) {
    var timer = setTimeout(function () { res(null); }, 250);
    addEventListener('message', function (e) { if (e.data && e.data.dcFx === 'host') { clearTimeout(timer); res(e.data.url); } });
    parent.postMessage({ dcFx: 'probe' }, '*');
  });
  var live = mode.then(function (url) {
    if (url || !navigator.gpu) return null;
    return import('https://cdn.jsdelivr.net/npm/vgpu@0.3.1/+esm').then(function (v) {
      return v.init().then(function (gpu) {
        var s = v.surface(gpu, cv, { alphaMode: 'premultiplied' }), fx = v.effect(gpu, wgsl);
        return function (t) { fx.set({ fx: { time: t / 1000, aspect: innerWidth / innerHeight } }); v.frame(gpu, function (f) { f.pass(s, fx); }); };
      });
    }).catch(function (e) { console.warn('fx: ' + e.message); return null; });
  });
  function fromHost(url, t) {
    if (!w) { var r = devicePixelRatio || 1; w = Math.max(1, Math.round(innerWidth * r * q)); h = Math.max(1, Math.round(innerHeight * r * q)); cv.width = w; cv.height = h; }
    return fetch(url, { method: 'POST', body: JSON.stringify({ wgsl: wgsl, t: t, w: w, h: h }) })
      .then(function (r) { if (!r.ok) throw new Error('fx frame ' + r.status); return r.arrayBuffer(); })
      .then(function (b) { cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(b), w, h), 0, 0); });
  }
  window.seek = function (t) { return mode.then(function (url) { return url ? fromHost(url, t) : live.then(function (draw) { if (draw) draw(t); }); }); };
})();
</script></x-embed>
