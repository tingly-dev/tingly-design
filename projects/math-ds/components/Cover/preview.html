<!-- @dsCard height=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 0 !important; }
  .cv { height: 360px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; justify-content: center; gap: 18px; background: radial-gradient(circle at 75% 45%, var(--night-raised) 0%, var(--night) 65%); position: relative; overflow: hidden; }
  .cv h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 88px; line-height: 1.05; background: linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cv p { margin: 0; font-family: var(--font-sans); color: var(--ink-muted); font-size: 18px; }
  .chips { display: flex; gap: 8px; }
  .chips i { width: 28px; height: 28px; border-radius: 50%; display: block; border: 1px solid var(--card-line); }
  svg { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<div class="cv">
  <p class="mm-eyebrow" style="font-size:16px;letter-spacing:5px">MATH IN MOTION · 视觉系统</p>
  <h1>数学奇遇记</h1>
  <p>夜空、两种字体、五个字号、一张卡片。</p>
  <div class="chips"><i style="background:var(--cyan)"></i><i style="background:var(--gold)"></i><i style="background:var(--pink)"></i><i style="background:var(--orange)"></i><i style="background:var(--ink)"></i></div>
  <svg width="280" height="280" viewBox="-140 -140 280 280" aria-hidden="true"><path id="sp" fill="none" stroke="url(#g)" stroke-width="2"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs></svg>
</div>
<script>
  // a spirograph (R=7, r=3, d=5), the mark of the series
  var d = '', R = 7, r = 3, k = 5, s = 12;
  for (var i = 0; i <= 600; i++) { var u = i / 600 * 6 * Math.PI, x = s * ((R - r) * Math.cos(u) + k * Math.cos((R - r) / r * u)), y = s * ((R - r) * Math.sin(u) - k * Math.sin((R - r) / r * u)); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
  document.getElementById('sp').setAttribute('d', d);
</script>
</body>
</html>
