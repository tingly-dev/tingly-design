name: E2E

# The end-to-end suites (e2e/run.py) on three schedules, because the full set is
# too slow to put on every PR:
#
#   patrol       every night on main, and by hand (workflow_dispatch): the full
#                set; a red run opens or updates one issue labelled e2e-patrol,
#                a green one closes it
#   pr smoke     a PR that touches the editor, the sandbox, the server or e2e/:
#                the smoke subset (open, edit, save in every kind)
#   release      release.yml calls this before it builds the tarball: the full
#                set, and a red run stops the release
#   record       by hand with "record baselines": takes the editor's screenshots
#                again (e2e/baseline.py) and pushes them to the e2e-baselines
#                branch, after a person has looked at the diffs of a red run
#
# The report and every suite's output are uploaded as the `e2e-report` artifact.
# See .design/harness.md and docs/en/development.md.

on:
  schedule:
    - cron: '17 18 * * *'  # 02:17 Beijing
  workflow_dispatch:
    inputs:
      suites:
        description: Suites to run, space-separated (empty runs every suite)
        required: false
        default: ''
      record:
        description: Record the screenshot baselines again and push them to the e2e-baselines branch
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'projects/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  workflow_call:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    if: ${{ !inputs.record }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up the browser, ffmpeg and git
        run: .github/scripts/e2e-setup.sh

      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          MODE: ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
        run: |
          # shellcheck disable=SC2086  # SUITES and MODE are word lists
          python3 e2e/run.py $MODE $SUITES

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/out/
          retention-days: 14

      - name: Show the report on the run page
        if: always()
        run: '[ -f e2e/out/report.md ] && cat e2e/out/report.md >> "$GITHUB_STEP_SUMMARY" || true'

  patrol-issue:
    name: Open or close the patrol issue
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Report the nightly result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/e2e-patrol-issue.sh

  record-baselines:
    name: Record the screenshot baselines
    if: ${{ inputs.record }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up the browser, ffmpeg and git
        run: .github/scripts/e2e-setup.sh

      - name: Take the screenshots
        env:
          DC_RECORD: '1'
        run: python3 e2e/run.py baseline

      - name: Push them to the e2e-baselines branch
        env:
          FROM: ${{ github.sha }}
        run: .github/scripts/e2e-baselines-push.sh

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-baselines
          path: e2e/out/baselines-new/
          retention-days: 14
