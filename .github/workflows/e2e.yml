name: E2E

# The end-to-end suites (e2e/run.py), on the schedules that can afford them,
# because the full set is too slow to put on every PR:
#
#   pr smoke     a PR that touches the editor, the sandbox, the server or e2e/:
#                the smoke subset (open, edit, save in every kind)
#   patrol       e2e-patrol.yml calls this every night on main and by hand: the
#                full set, and that workflow opens or closes the patrol issue
#   release      release.yml calls this before it builds the tarball: the full
#                set, and a red run stops the release
#
# Kept read-only, so a caller (release.yml) needs to grant it nothing more.
# The full set is cut into balanced slices (e2e/run.py --shard), one job each on
# its own runner, so a run takes the time of its slowest slice, not the sum; the
# smoke subset is one slice. A slice's report and every suite's output are
# uploaded as the `e2e-report-<slice>` artifact.
# See .design/harness.md and docs/en/development.md.

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'projects/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  workflow_call:
    inputs:
      suites:
        description: Suites to run, space-separated (empty runs every suite)
        type: string
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && 'smoke' || format('full {0}/4', matrix.shard) }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false  # a red slice should not hide what the others found
      matrix:
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[1]') || fromJSON('[1,2,3,4]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up the browser, ffmpeg and git
        run: .github/scripts/e2e-setup.sh

      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          MODE: ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
          SLICE: ${{ github.event_name == 'pull_request' && '1/1' || format('{0}/4', matrix.shard) }}
          # the runner's AppArmor blocks the user namespaces Chrome's sandbox needs (render.ts chromeArgs)
          DC_CHROME_SANDBOX: '0'
        run: |
          # shellcheck disable=SC2086  # SUITES and MODE are word lists
          python3 e2e/run.py $MODE --shard "$SLICE" $SUITES

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e/out/
          retention-days: 14

      - name: Show the report on the run page
        if: always()
        run: '[ -f e2e/out/report.md ] && cat e2e/out/report.md >> "$GITHUB_STEP_SUMMARY" || true'

