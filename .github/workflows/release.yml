name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-rc.N). The tag is the version: the build stamps
# it into package.json before bundling, as Tingly Box's npm.yml does, so nothing
# is bumped by hand on main.
#
#   e2e      every end-to-end suite (e2e.yml); red stops the release
#   build    tests, typecheck, `pnpm bundle`, start the bundle like a host,
#            pack it into tingly-design-<ver>.tgz plus its sha256
#   github   a GitHub release on the tag with both files attached
#   npm      the same bundle published as @tingly-dev/tingly-design and as
#            tingly-design, behind the `production` environment; a tag with a
#            suffix (-rc.1, -beta) goes to the `rc` dist-tag, any other to `latest`
#
# The release asset and the npm package are one tarball, so a host can pin a
# version and its sha256 and fetch it from either place. See .design/release.md.
#
# npm auth: Trusted Publishing only. The job's GitHub OIDC id-token is exchanged
# for a credential good for one publish; there is no NPM_TOKEN and no
# NODE_AUTH_TOKEN. The npm side is bound to this file name and the `production`
# environment, so do not rename either. Both packages are set to require 2FA and
# disallow tokens: outside this workflow only a maintainer with a one-time
# password can publish (scripts/npm-bootstrap.sh, .design/release.md).

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end suites
    # every suite (e2e.yml in its full mode); a red run stops the release before anything is built
    uses: ./.github/workflows/e2e.yml

  build:
    name: Build and check the bundle
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag and check a license is set
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ tag $TAG is not vX.Y.Z or vX.Y.Z-<suffix> (such as v0.2.0-rc.1)"
            exit 1
          fi
          VERSION="${TAG#v}"
          if [ -z "$(node -p 'require("./package.json").license || ""')" ]; then
            echo "❌ package.json has no license; pick one (and add LICENSE) before releasing, see .design/release.md"
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG=rc ;;
            *) DIST_TAG=latest ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (npm dist-tag $DIST_TAG)"

      # The bundle, its manifest and the npm package all read the root version.
      - name: Stamp the version into package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          node -p 'require("./package.json").version'

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Bundle
        run: pnpm bundle

      - name: Start the bundle like a host
        run: .github/scripts/smoke-bundle.sh dist/tingly-design "${{ steps.version.outputs.version }}"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          (cd dist/tingly-design && npm pack --pack-destination "$GITHUB_WORKSPACE/out")
          mv "out/tingly-dev-tingly-design-$VERSION.tgz" "out/tingly-design-$VERSION.tgz"
          (cd out && sha256sum "tingly-design-$VERSION.tgz" > "tingly-design-$VERSION.tgz.sha256" && cat ./*.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: tingly-design-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error

  github:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tingly-design-${{ needs.build.outputs.version }}
          path: out

      - name: Create the release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          PRERELEASE=()
          [ "$DIST_TAG" = latest ] || PRERELEASE=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- out/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --generate-notes "${PRERELEASE[@]}" -- out/*
          fi

  npm:
    name: Publish to npm
    needs: [build, github]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tingly-design-${{ needs.build.outputs.version }}
          path: out

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 required for OIDC trusted publishing"); process.exit(1) }' "$(npm --version)"

      # npm silently falls back to token auth (and then fails with E404) when
      # the OIDC exchange is rejected; do the same exchange here first so the
      # registry's reason is visible in the log. Fails before anything is published.
      - name: Verify npm OIDC trusted-publisher exchange
        run: .github/scripts/npm-oidc-check.sh @tingly-dev/tingly-design tingly-design

      - name: Publish @tingly-dev/tingly-design and tingly-design
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: .github/scripts/npm-publish.sh "out/tingly-design-$VERSION.tgz" "$DIST_TAG" @tingly-dev/tingly-design tingly-design
