name: Other
description: Anything that is not a feature, bug or feedback
title: "other: "
labels: ["other"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tingly Design is this about? It becomes a label and the scope of the title, such as other(motion).
      options:
        - Canvas
        - Slides
        - Design system
        - Dashboard
        - Docs
        - Motion
        - Editor (launcher, prompt bar, panels)
        - Server (fast AI, Claude Code, files)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is on your mind?
      description: A question, an idea for the project or something else.
    validations:
      required: true

