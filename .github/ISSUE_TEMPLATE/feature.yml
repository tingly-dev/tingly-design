name: Feature
description: Suggest something new or a change to how something works
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tingly Design is this about? It becomes a label and the scope of the title, such as feat(motion).
      options:
        - Canvas
        - Slides
        - Design system
        - Dashboard
        - Docs
        - Motion
        - Editor (launcher, prompt bar, panels)
        - UI/UX
        - Import/Export
        - Server (fast AI, Claude Code, files)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you want to do?
      description: The task you are trying to get done, before any solution.
      placeholder: I want to ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could it look like?
      description: Optional. A sketch, a reference or how another tool does it.

