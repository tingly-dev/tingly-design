name: Feedback
description: "A note on how it feels to use (UX, wording, rough edges)"
title: "feedback: "
labels: ["feedback"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tingly Design is this about? It becomes a label and the scope of the title, such as feedback(motion).
      options:
        - Canvas
        - Slides
        - Design system
        - Dashboard
        - Docs
        - Motion
        - Editor (launcher, prompt bar, panels)
        - UI/UX
        - Import/Export
        - Server (fast AI, Claude Code, files)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What got in your way?
      description: Where you were, what you were trying to do and what felt off. Screenshots help.
      placeholder: When I ..., it felt ...
    validations:
      required: true

