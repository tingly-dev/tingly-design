<aside>先让全场猜：加长 1 米，缝有多宽？大多数人会说“比头发丝还细”。答案约 16 厘米。原因：周长 = 2π × 半径，所以半径的增加 = 周长的增加 ÷ 2π = 1 ÷ 6.28 ≈ 0.16 米。这个结果跟原来的圆多大完全无关，地球和篮球都一样。动画最后一幕的篮球和绳子是按真实比例画的。</aside>
