<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>现状导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#1f2430}
</style>
</helmet>
<div style="width:1200px;height:760px;box-sizing:border-box;display:flex;background:#f5f6f8;overflow:hidden">
  <div style="width:76px;background:#ffffff;border-right:1px solid #e2e5ea;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;box-sizing:border-box">
    <sc-for list="{{rail}}" as="r" hint-placeholder-count="11">
      <div style="width:60px;height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:{{r.bg}}">
        <div style="width:20px;height:20px;border-radius:5px;border:2px solid {{r.stroke}};box-sizing:border-box"></div>
        <div style="font-size:11px;color:{{r.fg}}">{{r.label}}</div>
      </div>
    </sc-for>
  </div>
  <div style="width:236px;background:#ffffff;border-right:1px solid #e2e5ea;padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;overflow:hidden">
    <sc-for list="{{rows}}" as="w" hint-placeholder-count="15">
      <sc-if value="{{w.isDivider}}" hint-placeholder-val="{{ false }}">
        <div style="height:1px;background:#e2e5ea;margin:6px 0"></div>
      </sc-if>
      <sc-if value="{{w.isRow}}" hint-placeholder-val="{{ true }}">
        <div style="height:30px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;background:{{w.bg}}">
          <div style="width:16px;height:16px;border-radius:4px;background:#c9ced8"></div>
          <div style="font-size:13px;color:#2b3140">{{w.label}}</div>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="flex:1;padding:28px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
    <div style="font-size:20px;font-weight:700">Home · Claude Code</div>
    <div style="height:150px;border-radius:12px;background:#ffffff;border:1px dashed #c9ced8;display:flex;align-items:center;justify-content:center;color:#8a93a3;font-size:13px">页面内容（略）</div>
    <div style="background:#fff4e5;border:1px solid #f2c27b;border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:15px;font-weight:700;color:#8a4b00">为什么觉得杂乱</div>
      <sc-for list="{{pains}}" as="p" hint-placeholder-count="5">
        <div style="display:flex;gap:10px;font-size:13px;line-height:1.55;color:#4a3a22">
          <div style="flex:none;width:20px;height:20px;border-radius:10px;background:#d97706;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center">{{p.n}}</div>
          <div>{{p.text}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Dashboard','Home','Image','Team','Remote','Prompt','Tools','Guardrails','Bench','Credentials','System'];
    const exp = ['Prompt','Tools','Guardrails','Bench'];
    const rail = names.map((n) => {
      const on = n === 'Home';
      const e = exp.indexOf(n) >= 0;
      return { label: n, bg: on ? '#e8efff' : 'transparent', stroke: on ? '#3b6df0' : (e ? '#c9ced8' : '#8a93a3'), fg: on ? '#3b6df0' : (e ? '#a3aab8' : '#4a5263') };
    });
    const spec = ['Claude Code','prof:work-profile','+ 添加 Profile','-','Claude Desktop','Codex','OpenCode','DeepSeek','Xcode','VS Code','-','OpenAI','Anthropic','Embedding','Decisions'];
    const rows = spec.map((s) => {
      if (s === '-') return { isDivider: true, isRow: false };
      const lab = s.indexOf('prof:') === 0 ? s.slice(5) : s;
      return { isDivider: false, isRow: true, label: lab, bg: s === 'Claude Code' ? '#e8efff' : 'transparent' };
    });
    const pains = [
      { n: 1, text: '一级入口 11 个，且「实验」功能（Prompt / Tools / Guardrails / Bench）与核心功能同级，主次不分。' },
      { n: 2, text: 'Home 默认约 12 行可点条目（Pi / Cursor / Custom 默认已隐藏，全显示是 17 行）：Claude Code、Profile、6 个编码工具、4 个 SDK，用匿名分割线隔开，没有分区标题；用户通常只用 1–3 个。' },
      { n: 3, text: 'Team、Image 是「怎么接入」的变体，却和 Credentials、System 平级，用户要猜它属于哪一类。' },
      { n: 4, text: '「Home」其实是 Scenario 列表，名字承载了「首页」和「场景」两个意思（原则 3）。' },
      { n: 5, text: 'Dashboard / Logs / Quota history / Bench 都在回答「用得怎么样」，却散在 3 处。' }
    ];
    return { rail, rows, pains };
  }
}
</script>
</body>
</html>
